
name: CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Testy aplikacji
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom testy
        run: python -m pytest -v

  docker-build:
    name: Budowanie obrazu Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zbuduj obraz
        run: docker build -t student01-task-manager:${{ github.sha }} .

